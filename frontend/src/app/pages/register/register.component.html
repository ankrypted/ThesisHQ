<div class="auth-screen">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-icon">T</div>
      <span class="logo-text">ThesisHQ</span>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Join your PhD community</p>

    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input
          id="fullName"
          type="text"
          name="fullName"
          [(ngModel)]="fullName"
          placeholder="Jane Doe"
          autocomplete="name"
          required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="username"
            placeholder="janedoe"
            autocomplete="username"
            minlength="3"
            required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="you@university.edu"
            autocomplete="email"
            required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="At least 8 characters"
          autocomplete="new-password"
          minlength="8"
          required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="stage">Stage <span class="optional">optional</span></label>
          <select id="stage" name="stage" [(ngModel)]="stage">
            <option value="">Select stage</option>
            @for (s of stages; track s.value) {
              <option [value]="s.value">{{ s.label }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="field">Field <span class="optional">optional</span></label>
          <input
            id="field"
            type="text"
            name="field"
            [(ngModel)]="field"
            placeholder="e.g. Computer Science" />
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading() || !canSubmit">
        @if (loading()) {
          Creating account...
        } @else {
          Sign up
        }
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>

  </div>
</div>
